<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="mascaraLlave" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <!-- boca abierta de la llave -->
      <rect x="232" y="40" width="48" height="76" fill="#000"/>
      <!-- hexágono de la boca cerrada -->
      <polygon points="256,372 277,384 277,408 256,420 235,408 235,384" fill="#000"/>
    </mask>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="#F5B800"/>

  <!-- Martillo -->
  <g transform="rotate(-45 256 256)">
    <rect x="236" y="168" width="40" height="276" rx="14" fill="#1D1D1B"/>
    <rect x="166" y="84" width="180" height="92" rx="12" fill="#1D1D1B"/>
    <rect x="166" y="84" width="34" height="92" rx="10" fill="#1D1D1B" stroke="#F5B800" stroke-width="0"/>
    <rect x="206" y="84" width="6" height="92" fill="#F5B800"/>
  </g>

  <!-- Llave, con borde amarillo para separarla del martillo -->
  <g transform="rotate(45 256 256)" mask="url(#mascaraLlave)">
    <g fill="#1D1D1B" stroke="#F5B800" stroke-width="12" paint-order="stroke">
      <rect x="238" y="120" width="36" height="272" rx="12"/>
      <circle cx="256" cy="116" r="60"/>
      <circle cx="256" cy="396" r="48"/>
    </g>
  </g>
</svg>
